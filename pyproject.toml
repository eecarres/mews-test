[project]
name = "log_analyzer"
version = "0.1.0"
description = "Small utility to read logs file and find regressions"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["logs", "analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer~=0.12.3",
    "pandas~=2.2.2",
]

[project.scripts]
log_analyzer = "log_analyzer:app"

[tool.black]
line-length = 120
target-version = ['py38']
include = '\.pyi?$'
